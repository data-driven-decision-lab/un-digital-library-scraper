name: UN Scraper (Every 6 Days)

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 2 */6 * *' # Runs every 6 days at 2:00 AM UTC

concurrency:
  group: un-votes-database-update
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # for the keep-alive step

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AWS_WAF_TOKEN: ${{ secrets.AWS_WAF_TOKEN }}
      LOG_LEVEL: INFO

    steps:
      # ponytail: GitHub disables schedules in public repos after 60 days without
      # commits (happened 2026-07-19). Re-enabling via the API each run resets that
      # clock; if GitHub stops honouring it, switch to a periodic empty commit.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/un-scraper-6days.yml/enable"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Check secrets are not empty and show lengths
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          check_var() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              echo "❌ $name is empty or not set."
              exit 1
            else
              echo "✅ $name length: ${#value}"
            fi
          }
          check_var "GEMINI_API_KEY"
          check_var "TURSO_DATABASE_URL"
          check_var "TURSO_AUTH_TOKEN"
          check_var "AWS_WAF_TOKEN"

      - name: DNS check for Gemini API
        run: |
          echo "🔍 Checking DNS resolution for generativelanguage.googleapis.com"
          if dig +short generativelanguage.googleapis.com | grep -qE '^[0-9.]+'; then
            echo "✅ DNS resolution successful for generativelanguage.googleapis.com"
          else
            echo "❌ DNS resolution failed for generativelanguage.googleapis.com"
            exit 1
          fi

      - name: Run regression tests
        run: python -m unittest discover tests

      - name: Run scraper (writes un_votes_unga + un_votes_with_sc to Turso)
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from un_data_pipeline.scraper_pipeline import main; main()"
