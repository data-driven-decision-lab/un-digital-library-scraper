name: UN Data Pipeline (Every 6 Days)

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 2 */6 * *' # Runs every 6 days at 2:00 AM UTC

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      API_KEY: ${{ secrets.API_KEY }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Check secrets are not empty and show lengths
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          check_var() {
            local name="$1"
            local value="${!name}"
            if [ -z "$value" ]; then
              echo "❌ $name is empty or not set."
              exit 1
            else
              echo "✅ $name length: ${#value}"
            fi
          }
          check_var "API_KEY"
          check_var "TURSO_DATABASE_URL"
          check_var "TURSO_AUTH_TOKEN"

      - name: DNS check for OpenAI API
        run: |
          echo "🔍 Checking DNS resolution for api.openai.com"
          if dig +short api.openai.com | grep -qE '^[0-9.]+'; then
            echo "✅ DNS resolution successful for api.openai.com"
          else
            echo "❌ DNS resolution failed for api.openai.com"
            exit 1
          fi

      - name: HTTP check for OpenAI API availability (with auth)
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "🌐 Testing HTTPS connection to OpenAI API with authentication"
          if curl -s --head --fail -H "Authorization: Bearer $API_KEY" \
               https://api.openai.com/v1/models > /dev/null; then
            echo "✅ OpenAI API is reachable"
          else
            echo "❌ OpenAI API is not reachable (HTTP check failed)"
            exit 1
          fi

      - name: Run scraper (writes un_votes_raw + un_votes_with_sc to Turso)
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from un_data_pipeline.scraper_pipeline import main; main()"

      - name: Run dashboard pipeline (recomputes annual_scores, topic_votes_yearly, pairwise_similarity_yearly in Turso)
        run: |
          python -m src.un_data_pipeline.dashboard_data_pipeline

      - name: Commit refreshed fallback CSVs back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/un_report_api/app/required_csvs/annual_scores.csv \
                  src/un_report_api/app/required_csvs/topic_votes_yearly.csv \
                  src/un_report_api/app/required_csvs/pairwise_similarity_yearly.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "data: refresh Turso-derived CSVs (auto) [skip ci]"
            git push
          fi
