name: UN Scraper (Every 6 Days)

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 2 */6 * *' # Runs every 6 days at 2:00 AM UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      API_KEY: ${{ secrets.API_KEY }} # For OpenAI API
      LOG_LEVEL: INFO
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install Chrome for Selenium
          sudo apt-get update
          sudo apt-get install google-chrome-stable -y

      - name: Run Scraper
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from un_data_pipeline.scraper_pipeline import main; main()"