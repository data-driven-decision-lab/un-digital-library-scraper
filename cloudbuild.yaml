steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/unreportapi:$COMMIT_SHA', '-f', 'Dockerfile', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/unreportapi:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'unreportapi'
      - '--image'
      - 'gcr.io/$PROJECT_ID/unreportapi:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'TURSO_DATABASE_URL=$$TURSO_DATABASE_URL,TURSO_AUTH_TOKEN=$$TURSO_AUTH_TOKEN'

images:
  - 'gcr.io/$PROJECT_ID/unreportapi:$COMMIT_SHA'
